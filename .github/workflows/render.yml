name: render-and-check
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'  # 每日 21:00 北京时间，画面线固定班次
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pillow
      - name: 云端渲染全部视角
        run: python proxy_render.py
      - name: 断言产物齐全
        run: |
          for f in proxy_view_wide proxy_view_close proxy_view_prc proxy_view_strait proxy_view_helo proxy_view_anchorage; do
            [ -s "$f.png" ] || { echo "MISSING/EMPTY: $f.png"; exit 1; }
          done
          ls -la proxy_view_*.png
      - uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: proxy_view_*.png
          retention-days: 7
